<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wembley Gaming Hub</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://jsdelivr.net"></script>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <script>
    // FIXED SECURE BACKEND DB LINKS STRINGS
    const SUPABASE_URL = "https://supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZXBmaGttdnRwbG1sbGd0Yml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MTk2MzIsImV4cCI6MjA4NzA5NTYzMn0.Y8_pbe95V4z-vU-b-z6Tszv_A8N-u19bWb24zV-f4-8";
    
    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
      console.error("Database connection configuration error:", e);
    }

    let currentRole = 'attendant'; 
    let activeSessions = JSON.parse(localStorage.getItem('wembley_active_sessions')) || {};
    
    let settings = JSON.parse(localStorage.getItem('wembley_settings')) || {
      ps5_fc_rate: 50,
      ps4_fc_rate: 30,
      ps4_gta_rate: 2,
      buffer_minutes: 4
    };

    function switchView(role) {
      currentRole = role;
      document.getElementById('nav-attendant').className = role === 'attendant' ? 'px-4 py-2 bg-indigo-600 rounded-lg font-bold text-white shadow-md' : 'px-4 py-2 text-slate-400 font-medium';
      document.getElementById('nav-admin').className = role === 'admin' ? 'px-4 py-2 bg-indigo-600 rounded-lg font-bold text-white shadow-md' : 'px-4 py-2 text-slate-400 font-medium';
      
      document.getElementById('attendant-view').classList.toggle('hidden', role !== 'attendant');
      document.getElementById('admin-view').classList.toggle('hidden', role !== 'admin');
      
      if(role === 'admin') loadAdminDashboard();
    }

    function saveSettings(e) {
      e.preventDefault();
      settings.ps5_fc_rate = parseFloat(document.getElementById('set-ps5-fc').value);
      settings.ps4_fc_rate = parseFloat(document.getElementById('set-ps4-fc').value);
      settings.ps4_gta_rate = parseFloat(document.getElementById('set-ps4-gta').value);
      settings.buffer_minutes = parseInt(document.getElementById('set-buffer').value);
      localStorage.setItem('wembley_settings', JSON.stringify(settings));
      alert('Settings & Prices updated successfully!');
      renderAttendantStations();
    }

    function startSession(stationId, type, gameMode) {
      activeSessions[stationId] = {
        type: type,
        gameMode: gameMode,
        startTime: new Date().toISOString()
      };
      localStorage.setItem('wembley_active_sessions', JSON.stringify(activeSessions));
      renderAttendantStations();
    }

    async function stopSession(stationId) {
      const session = activeSessions[stationId];
      if (!session) return;

      const endTime = new Date();
      const startTime = new Date(session.startTime);
      const durationMs = endTime - startTime;
      const durationMinutes = Math.max(1, Math.round(durationMs / 60000));
      
      let amount = 0;
      if (session.gameMode === 'FC Match') {
        amount = session.type === 'PS5' ? settings.ps5_fc_rate : settings.ps4_fc_rate;
      } else {
        amount = durationMinutes * settings.ps4_gta_rate;
      }

      const logData = {
        attendant_id: "Wembley_Attendant",
        console_name: session.type,
        game_mode: session.gameMode,
        start_time: session.startTime,
        end_time: endTime.toISOString(),
        duration_minutes: durationMinutes,
        calculated_amount_ksh: amount
      };

      delete activeSessions[stationId];
      localStorage.setItem('wembley_active_sessions', JSON.stringify(activeSessions));
      renderAttendantStations();

      try {
        const { error } = await supabase.from('session_logs').insert([logData]);
        if (error) throw error;
        alert(`Session Ended!\nTotal Amount Due: KSh ${amount}`);
      } catch (err) {
        let offlineLogs = JSON.parse(localStorage.getItem('wembley_offline_logs')) || [];
        logData.is_synced_offline = true;
        offlineLogs.push(logData);
        localStorage.setItem('wembley_offline_logs', JSON.stringify(offlineLogs));
        alert(`Saved Offline!\nTotal Amount: KSh ${amount}\nWill auto-sync when network returns.`);
      }
    }

    async function syncOfflineLogs() {
      let offlineLogs = JSON.parse(localStorage.getItem('wembley_offline_logs')) || [];
      if (offlineLogs.length === 0 || !supabase) return;

      try {
        const { error } = await supabase.from('session_logs').insert(offlineLogs.map(log => {
          const { is_synced_offline, ...cleanLog } = log;
          return cleanLog;
        }));
        if (!error) {
          localStorage.removeItem('wembley_offline_logs');
          if(currentRole === 'admin') loadAdminDashboard();
        }
      } catch (e) {
        console.log("Sync failed...");
      }
    }

    async function loadAdminDashboard() {
      if(!supabase) return;
      await syncOfflineLogs();
      const filter = document.getElementById('admin-time-filter').value;
      let dateLimit = new Date();
      if (filter === 'week') dateLimit.setDate(dateLimit.getDate() - 7);
      if (filter === 'month') dateLimit.setMonth(dateLimit.getMonth() - 1);

      let query = supabase.from('session_logs').select('*');
      if (filter !== 'all') {
        query = query.gte('start_time', dateLimit.toISOString());
      }

      const { data, error } = await query.order('start_time', { ascending: false });
      if (error) {
        document.getElementById('audit-table-body').innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-400">Error loading live data logs.</td></tr>`;
        return;
      }

      let totalRevenue = 0;
      let totalMinutes = 0;
      let tableHtml = '';

      data.forEach(log => {
        totalRevenue += parseFloat(log.calculated_amount_ksh);
        totalMinutes += log.duration_minutes || 0;
        
        const isSuspiciousFC = log.game_mode === 'FC Match' && log.duration_minutes > (12 + settings.buffer_minutes);

        tableHtml += `
          <tr class="border-b border-slate-800 ${isSuspiciousFC ? 'bg-red-950/40 text-red-200' : ''}">
            <td class="p-3 text-sm">${new Date(log.start_time).toLocaleString()}</td>
            <td class="p-3 font-semibold">${log.console_name}</td>
            <td class="p-3 text-sm">${log.game_mode}</td>
            <td class="p-3 ${isSuspiciousFC ? 'font-bold underline' : ''}">${log.duration_minutes} mins</td>
            <td class="p-3 font-bold text-emerald-400">KSh ${parseFloat(log.calculated_amount_ksh).toFixed(2)}</td>
            <td class="p-3 text-xs text-slate-400">${isSuspiciousFC ? '⚠️ Exceeded FC Time' : 'OK'}</td>
          </tr>
        `;
      });

      document.getElementById('stat-revenue').innerText = `KSh ${totalRevenue.toFixed(2)}`;
      document.getElementById('stat-sessions').innerText = data.length;
      document.getElementById('stat-hours').innerText = (totalMinutes / 60).toFixed(1);
      document.getElementById('audit-table-body').innerHTML = tableHtml || `<tr><td colspan="6" class="p-4 text-center text-slate-500">No entries recorded.</td></tr>`;
    }

    function renderAttendantStations() {
      const stations = [
        { id: 'ps5_1', type: 'PS5', name: 'PS5 - Station 1' },
        { id: 'ps4_1', type: 'PS4', name: 'PS4 - Station 2' },
        { id: 'ps4_2', type: 'PS4', name: 'PS4 - Station 3' }
      ];

      let html = '';
      stations.forEach(st => {
        const active = activeSessions[st.id];
        if (active) {
          const start = new Date(active.startTime);
          html += `
            <div class="bg-slate-800 p-5 rounded-xl border border-indigo-500/50 shadow-lg">
              <div class="flex justify-between items-center mb-3">
                <h3 class="text-xl font-bold text-white">${st.name}</h3>
                <span class="px-2.5 py-1 bg-red-500/20 text-red-400 rounded-full text-xs font-bold uppercase tracking-wider animate-pulse">Live</span>
              </div>
              <p class="text-slate-400 text-sm">Game: <strong class="text-slate-200">${active.gameMode}</strong></p>
              <p class="text-slate-400 text-sm mb-4">Start Time: <strong class="text-slate-200">${start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</strong></p>
              <button onclick="stopSession('${st.id}')" class="w-full py-2.5 bg-red-600 hover:bg-red-700 transition text-white font-bold rounded-lg shadow-md">
                End Session & Bill
              </button>
            </div>
          `;
        } else {
          html += `
            <div class="bg-slate-800/60 p-5 rounded-xl border border-slate-700">
              <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-slate-300">${st.name}</h3>
                <span class="px-2.5 py-1 bg-slate-700 text-slate-400 rounded-full text-xs font-bold uppercase">Open</span>
              </div>
              <div class="space-y-2">
                ${st.type === 'PS5' ? `
                  <button onclick="startSession('${st.id}', 'PS5', 'FC Match')" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 transition font-semibold rounded-lg text-sm text-white">
                    Start FC Match (KSh 50)
                  </button>
                ` : `
                  <button onclick="startSession('${st.id}', 'PS4', 'FC Match')" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 transition font-semibold rounded-lg text-sm text-white">
                    Start FC Match (KSh 30)
                  </button>
