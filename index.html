<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wembley Gaming Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script src="https://cdn.tailwindcss.com"></script><style>body{background:#08101f url("https://images.unsplash.com/photo-1511512578047-dfb367046420") center/cover fixed}.panel{background:rgba(15,23,42,.9);backdrop-filter:blur(10px)}</style></head><body class="text-white min-h-screen"><div id="login" class="min-h-screen grid place-items-center p-4"><div class="panel p-7 rounded-2xl w-full max-w-md"><h1 class="text-3xl font-black">🎮 Wembley Gaming Hub</h1><p class="text-slate-400 mb-5">Attendant Login</p><input id="u" placeholder="Username" class="w-full p-3 mb-3 bg-slate-800 rounded"><input id="p" type="password" placeholder="Password" class="w-full p-3 mb-4 bg-slate-800 rounded"><button id="lb" class="w-full p-3 bg-indigo-600 rounded font-bold">LOGIN</button><p id="m" class="text-red-400 mt-3"></p></div></div><main id="app" class="hidden max-w-6xl mx-auto p-4"><header class="panel p-5 rounded-2xl mb-5 flex justify-between"><div><h1 class="text-2xl font-black">Wembley Gaming Hub</h1><p class="text-slate-400">Attendant Dashboard</p></div><div class="flex gap-2"><button onclick="syncOfflineLogs(true)" class="bg-amber-600 px-3 py-2 rounded"><span data-offline-count>Cloud synced</span></button><button onclick="localStorage.removeItem('wembley_attendant_user');location.reload()" class="bg-slate-700 px-3 py-2 rounded">Logout</button></div></header><div id="stations" class="grid md:grid-cols-3 gap-4"></div></main><script>
function start(id,type,billing,gameMode,duration=0){activeSessions[id]={type,billing,gameMode,startTime:new Date().toISOString(),duration};saveLocal();renderAttendantStations()}
function renderAttendantStations(){let ss=[["ps5_1","PS5","PS5 — Station 1"],["ps4_1","PS4","PS4 — Station 2"],["ps4_2","PS4","PS4 — Station 3"]];stations.innerHTML=ss.map(([id,type,name])=>{let a=activeSessions[id];if(a)return`<div class="panel p-5 rounded-2xl border border-indigo-500"><h2 class="text-xl font-bold">${name}</h2><p class="text-slate-400 mt-2">${esc(a.gameMode)}</p><p id="t-${id}" class="text-3xl font-mono my-4">00:00:00</p><button onclick="finishSession('${id}')" class="w-full p-3 bg-red-600 rounded font-bold">END SESSION & BILL</button></div>`;if(type==="PS5")return`<div class="panel p-5 rounded-2xl"><h2 class="text-xl font-bold mb-4">${name}</h2><button onclick="start('${id}','PS5','fc','FC Match')" class="w-full p-3 bg-indigo-600 rounded mb-2">⚽ FC Match — ${money(settings.ps5_fc_rate)}/game</button><button onclick="start('${id}','PS5','ps5block','Continuous Play')" class="w-full p-3 bg-emerald-600 rounded">🎮 Continuous Play — ${money(settings.ps5_block_rate)}/15 min</button></div>`;return`<div class="panel p-5 rounded-2xl"><h2 class="text-xl font-bold mb-4">${name}</h2><button onclick="start('${id}','PS4','fc','FC Match')" class="w-full p-3 bg-indigo-600 rounded mb-3">⚽ FC Match — ${money(settings.ps4_fc_rate)}/game</button><select id="g-${id}" class="w-full p-3 mb-3 bg-slate-800 rounded">${settings.games.map(g=>`<option value="${esc(g.name)}">${esc(g.name)} — ${money(g.rate)}/min</option>`).join("")}</select><select id="d-${id}" class="w-full p-3 mb-3 bg-slate-800 rounded">${[15,30,45,60,90,120].map(x=>`<option value="${x}">${x} minutes</option>`).join("")}</select><button onclick="start('${id}','PS4','minute',document.getElementById('g-${id}').value,+document.getElementById('d-${id}').value)" class="w-full p-3 bg-emerald-600 rounded">⏱ Start Timed Game</button></div>`}).join("");updateSyncBadge()}
setInterval(()=>{Object.entries(activeSessions).forEach(([id,s])=>{let e=document.getElementById("t-"+id);if(!e)return;let ms=Date.now()-new Date(s.startTime);let left=s.duration?s.duration*60000-ms:ms;if(s.duration&&left<=0){e.textContent="00:00:00";if(!s.alerted){s.alerted=true;saveLocal();beep();alert("⏰ Time is finished!")}return}let sec=Math.floor(Math.max(0,left)/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),q=sec%60;e.textContent=[h,m,q].map(x=>String(x).padStart(2,"0")).join(":")})},1000);
lb.onclick=async()=>{try{if(await auth("attendant",u.value.trim(),p.value)){localStorage.setItem("wembley_attendant_user",u.value.trim());login.classList.add("hidden");app.classList.remove("hidden");renderAttendantStations();syncOfflineLogs()}else m.textContent="Incorrect username or password"}catch(e){m.textContent="Unable to connect to server";console.error(e)}};if(localStorage.getItem("wembley_attendant_user")){login.classList.add("hidden");app.classList.remove("hidden");renderAttendantStations();syncOfflineLogs()}
</script></body></html>
