<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wembley Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script src="https://cdn.tailwindcss.com"></script><style>body{background:#08101f url("https://images.unsplash.com/photo-1511512578047-dfb367046420") center/cover fixed}.panel{background:rgba(15,23,42,.93);backdrop-filter:blur(10px)}</style></head><body class="text-white min-h-screen"><div id="login" class="min-h-screen grid place-items-center p-4"><div class="panel p-7 rounded-2xl w-full max-w-md"><h1 class="text-3xl font-black">Wembley Admin</h1><input id="u" placeholder="Username" class="w-full p-3 mt-5 mb-3 bg-slate-800 rounded"><input id="p" type="password" placeholder="Password" class="w-full p-3 mb-4 bg-slate-800 rounded"><button id="lb" class="w-full p-3 bg-indigo-600 rounded font-bold">LOGIN</button><p id="m" class="text-red-400 mt-3"></p></div></div><main id="app" class="hidden max-w-6xl mx-auto p-4"><header class="panel p-5 rounded-2xl mb-5 flex justify-between"><h1 class="text-2xl font-black">Admin Dashboard</h1><button onclick="localStorage.removeItem('wembley_admin_user');location.reload()" class="bg-slate-700 px-3 py-2 rounded">Logout</button></header><section class="panel p-5 rounded-2xl mb-5"><div class="flex gap-3 items-center flex-wrap"><b>Revenue:</b><select id="f" class="bg-slate-800 p-2 rounded"><option value="day">Daily</option><option value="week">Weekly</option><option value="month">Monthly</option><option value="all">All Time</option></select><button onclick="report()" class="bg-indigo-600 px-4 py-2 rounded">Refresh</button></div><div class="grid md:grid-cols-3 gap-4 mt-5"><div><small>Revenue</small><div id="r" class="text-2xl font-black">KSh 0.00</div></div><div><small>Sessions</small><div id="c" class="text-2xl font-black">0</div></div><div><small>Hours</small><div id="h" class="text-2xl font-black">0</div></div></div><p id="err" class="text-red-400 mt-3"></p><div class="mt-5 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-400 border-b border-slate-700"><th class="p-2">Date</th><th class="p-2">Time</th><th class="p-2">Year</th><th class="p-2">Month</th><th class="p-2">Console</th><th class="p-2">Game</th><th class="p-2">Minutes</th><th class="p-2">Amount</th></tr></thead><tbody id="rows"></tbody></table></div><h3 class="text-lg font-bold mt-6">Game Performance</h3><div id="perf" class="grid md:grid-cols-3 gap-3 mt-3"></div></section><section class="panel p-5 rounded-2xl mb-5"><h2 class="text-xl font-bold mb-4">Prices & PS4 Games</h2><div class="grid md:grid-cols-3 gap-3"><label>PS5 FC<input id="a" type="number" class="w-full bg-slate-800 p-2 rounded"></label><label>PS5 Continuous / 15 min<input id="b" type="number" class="w-full bg-slate-800 p-2 rounded"></label><label>PS4 FC<input id="d" type="number" class="w-full bg-slate-800 p-2 rounded"></label></div><div id="gs" class="mt-4 space-y-2"></div><button onclick="add()" class="bg-emerald-600 px-4 py-2 rounded mt-3">+ Add Game</button><button onclick="save()" class="bg-indigo-600 px-4 py-2 rounded mt-3 ml-2">Save Prices & Games</button><p id="sm" class="text-emerald-400 mt-3"></p></section><section class="panel p-5 rounded-2xl"><h2 class="text-xl font-bold mb-3">Shop Attendant Credentials</h2><input id="au" placeholder="Username" class="bg-slate-800 p-3 rounded"><input id="ap" type="password" placeholder="New password" class="bg-slate-800 p-3 rounded ml-2"><button onclick="cred()" class="bg-indigo-600 p-3 rounded ml-2">Create / Change</button><p id="cm" class="text-emerald-400 mt-3"></p></section></main><script>
function draw(){gs.innerHTML=settings.games.map(g=>`<div class="flex gap-2"><input class="gn flex-1 bg-slate-800 p-2 rounded" value="${esc(g.name)}"><input class="gr w-28 bg-slate-800 p-2 rounded" type="number" value="${g.rate}"><button onclick="this.parentElement.remove()" class="bg-red-600 px-3 rounded">Remove</button></div>`).join("")}
function add(){const x=document.createElement("div");x.className="flex gap-2";x.innerHTML='<input class="gn flex-1 bg-slate-800 p-2 rounded" placeholder="Game name"><input class="gr w-28 bg-slate-800 p-2 rounded" type="number" value="2"><button onclick="this.parentElement.remove()" class="bg-red-600 px-3 rounded">Remove</button>';gs.appendChild(x)}
async function boot(){try{await loadCloudSettings()}catch(e){}a.value=settings.ps5_fc_rate;b.value=settings.ps5_block_rate;d.value=settings.ps4_fc_rate;draw();report()}
async function save(){settings.ps5_fc_rate=+a.value;settings.ps5_block_rate=+b.value;settings.ps4_fc_rate=+d.value;settings.games=[...document.querySelectorAll("#gs>div")].map(x=>({name:x.querySelector(".gn").value.trim(),rate:+x.querySelector(".gr").value})).filter(x=>x.name);try{await saveCloudSettings();sm.textContent="✓ Saved to cloud. Attendant will receive the new settings."}catch(e){sm.textContent="Save failed: "+e.message}}
async function cred(){try{await saveCredential(au.value.trim(),ap.value,"attendant");cm.textContent="✓ Attendant credentials saved."}catch(e){cm.textContent="Save failed: "+e.message}}
async function report(){try{let q=sb.from("session_logs").select("*");let z=new Date();if(f.value==="day")z.setHours(0,0,0,0);if(f.value==="week"){let day=z.getDay()||7;z.setDate(z.getDate()-day+1);z.setHours(0,0,0,0)}if(f.value==="month"){z.setDate(1);z.setHours(0,0,0,0)}if(f.value!=="all")q=q.gte("start_time",z.toISOString());const {data,error}=await q.order("start_time",{ascending:false});if(error)throw error;const rowsData=data||[];r.textContent=money(rowsData.reduce((s,v)=>s+Number(v.calculated_amount_ksh||0),0));c.textContent=rowsData.length;h.textContent=(rowsData.reduce((s,v)=>s+Number(v.duration_minutes||0),0)/60).toFixed(1);rows.innerHTML=rowsData.map(v=>{const dt=new Date(v.start_time);return `<tr class="border-b border-slate-800"><td class="p-2">${dt.toLocaleDateString()}</td><td class="p-2">${dt.toLocaleTimeString()}</td><td class="p-2">${dt.getFullYear()}</td><td class="p-2">${dt.toLocaleString(undefined,{month:"long"})}</td><td class="p-2">${esc(v.console_name)}</td><td class="p-2 font-semibold">${esc(v.game_mode)}</td><td class="p-2">${v.duration_minutes||0}</td><td class="p-2 font-bold text-emerald-400">${money(v.calculated_amount_ksh)}</td></tr>`}).join("")||`<tr><td colspan="8" class="p-3 text-slate-400">No records.</td></tr>`;const perf={};rowsData.forEach(v=>{const g=v.game_mode||"Unknown";if(!perf[g])perf[g]={count:0,revenue:0,minutes:0};perf[g].count++;perf[g].revenue+=Number(v.calculated_amount_ksh||0);perf[g].minutes+=Number(v.duration_minutes||0)});perf.innerHTML=Object.entries(perf).sort((a,b)=>b[1].revenue-a[1].revenue).map(([g,v])=>`<div class="bg-slate-800 p-4 rounded-xl"><div class="font-bold">${esc(g)}</div><div>${v.count} sessions</div><div>${v.minutes} mins</div><div class="text-emerald-400 font-bold">${money(v.revenue)}</div></div>`).join("")||`<div class="text-slate-400">No game data.</div>`;err.textContent=""}catch(e){err.textContent="Could not load records: "+e.message;console.error(e)}}
lb.onclick=async()=>{try{if(await auth("admin",u.value.trim(),p.value.trim())){localStorage.setItem("wembley_admin_user",u.value.trim());login.classList.add("hidden");app.classList.remove("hidden");boot()}else m.textContent="Incorrect username or password"}catch(e){m.textContent="Unable to connect to server";console.error(e)}};if(localStorage.getItem("wembley_admin_user")){login.classList.add("hidden");app.classList.remove("hidden");boot()}
</script></body></html>
